  <rect x="144" y="266" width="150" height="7" rx="3.5" fill="#60a5fa"/>
  <rect x="144" y="282" width="100" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="128" y="298" width="70" height="7" rx="3.5" fill="#fbbf24"/>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="340" y="150" width="130" height="240" rx="22" fill="#0f172a"/>
