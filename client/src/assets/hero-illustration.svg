  <rect x="60" y="136" width="42" height="6" rx="3" fill="#334155"/>
  <rect x="60" y="150" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="60" y="164" width="38" height="6" rx="3" fill="#334155"/>

  <rect x="128" y="122" width="120" height="7" rx="3.5" fill="#60a5fa"/>
  <rect x="144" y="138" width="170" height="7" rx="3.5" fill="#34d399"/>
  <rect x="144" y="154" width="90" height="7" rx="3.5" fill="#f472b6"/>
  <rect x="160" y="170" width="140" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="160" y="186" width="200" height="7" rx="3.5" fill="#fbbf24"/>
  <rect x="160" y="202" width="110" height="7" rx="3.5" fill="#60a5fa"/>
  <rect x="144" y="218" width="160" height="7" rx="3.5" fill="#94a3b8"/>
