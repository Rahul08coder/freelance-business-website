  <text x="358" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Experiences</text>
  <rect x="358" y="274" width="90" height="5" rx="2.5" fill="#cbd5e1"/>
