<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Laptop and phone showing a website design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="320" cy="235" r="215" fill="url(#bg)"/>
  <ellipse cx="320" cy="412" rx="290" ry="10" fill="#1e3a8a" opacity="0.08"/>

  <!-- decorative dots -->
  <circle cx="70" cy="60" r="5" fill="#93c5fd"/>
  <circle cx="590" cy="110" r="7" fill="#bfdbfe"/>
  <circle cx="40" cy="250" r="4" fill="#bfdbfe"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="400" height="250" rx="14" fill="#0f172a"/>
    <rect x="52" y="92" width="376" height="226" rx="6" fill="url(#screen)"/>
    <path d="M10 330 H470 L452 362 H28 Z" fill="#cbd5e1"/>
    <rect x="205" y="330" width="70" height="7" rx="3.5" fill="#94a3b8"/>
  </g>

  <!-- code editor -->
  <rect x="52" y="92" width="376" height="18" rx="6" fill="#0b1220"/>
  <circle cx="64" cy="101" r="3" fill="#f87171"/>
  <circle cx="75" cy="101" r="3" fill="#fbbf24"/>
  <circle cx="86" cy="101" r="3" fill="#34d399"/>
