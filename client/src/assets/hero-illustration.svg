  <!-- mug -->
  <path d="M575 338 Q599 338 599 358 Q599 378 575 378" fill="none" stroke="#1e293b" stroke-width="8"/>
  <rect x="505" y="322" width="72" height="74" rx="9" fill="#1e293b"/>
  <text x="541" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">&lt;/&gt;</text>
